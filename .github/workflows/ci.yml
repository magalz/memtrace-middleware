name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test --reporter=junit --reporter=verbose --outputFile.junit=test-results.xml 2>test-stderr.log || true
      - name: Check test results
        run: grep -q 'failures="0"' test-results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results.xml

  compat-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - id: detect
        run: npx tsx scripts/ci-detect-intent-change.ts --base-ref=origin/main --head-ref=HEAD
        continue-on-error: true
      - if: steps.detect.outcome == 'success'
        run: pnpm test -- --run tests/unit/adapters/bmad.test.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-gate-results
          path: test-results.xml

  contract-canary:
    runs-on: ubuntu-latest
    needs: compat-gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test -- --run tests/contract/canary.test.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-results
          path: canary-results.json

  build:
    runs-on: ubuntu-latest
    needs: contract-canary
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build

  load-test:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - name: Install k6
        run: |
          if command -v k6 >/dev/null 2>&1; then
            echo "k6 already installed: $(k6 version)"
            exit 0
          fi
          curl -s https://dl.k6.io/rpm/repo.rpm | sudo rpm --import - 2>/dev/null || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 2>/dev/null || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y k6
          echo "k6 installed: $(k6 version)"
      - name: Start test server
        run: |
          MEMTRACE_TEST_MODE=1 node dist/test-server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/status >/dev/null 2>&1; then
              echo "test server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "test server failed to start after 30s" >&2
          exit 1
      - name: Run k6 latency tests
        id: k6-latency
        run: |
          mkdir -p load/results
          BASE_URL=http://localhost:3000 k6 run load/concurrent-dispatches.js
        continue-on-error: true
      - name: Run k6 degradation tests
        id: k6-degradation
        run: |
          mkdir -p load/results
          BASE_URL=http://localhost:3000 k6 run load/degradation-scenarios.js
        continue-on-error: true
      - name: Stop test server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: load/results/
